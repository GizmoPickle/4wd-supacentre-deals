<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The site has its own dark theme; this stops in-app browsers auto-darkening it. -->
  <meta name="color-scheme" content="light dark">
  <title>Rig 4 Less</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Rig 4 Less">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <button class="menu-btn" id="menuBtn" aria-label="Shop by category" aria-expanded="false">
        <span class="burger"><i></i><i></i><i></i></span><span class="menu-label">Menu</span>
      </button>
      <button class="back-btn" id="backBtn" hidden aria-label="Back">‹</button>
      <a class="brand" href="#/"><img src="logo-header.svg" alt="Rig 4 Less" width="235" height="50"><span class="tagline">Find the cheapest deals on 4WD Supacentre</span></a>
      <form class="search" id="searchForm" role="search">
        <input id="searchInput" type="search" placeholder="Search e.g. solar panel, fridge, swag…" autocomplete="off" aria-label="Search products">
        <button type="submit" aria-label="Search">
          <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M16.5 16.5 21 21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </button>
      </form>
    </div>
  </header>
  <div class="strip" id="strip"></div>

  <nav class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <span>Shop by category</span>
      <button id="drawerClose" aria-label="Close menu">×</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </nav>
  <div class="scrim" id="scrim"></div>

  <main id="app" class="wrap"></main>

  <footer class="foot wrap">
    Rig 4 Less is an unofficial price tracker for 4WD Supacentre and isn't affiliated with them. Prices are read from the store's public catalogue; always confirm on the store before buying.
    <span id="footStatus"></span>
    <button id="refreshBtn" class="linkish">Check prices now</button>
  </footer>

  <script type="module" src="/app.js"></script>
</body>
</html>

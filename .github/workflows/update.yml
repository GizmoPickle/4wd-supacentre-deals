# Checks prices every 6 hours, saves the price history to the repo, and
# publishes the site to GitHub Pages. Also runs on every push to main and can be
# run by hand (Actions tab → "Update prices and publish" → Run workflow).
name: Update prices and publish

on:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # commit the price history
  pages: write      # publish the site
  id-token: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Always start from the latest main, even when re-running an older run,
      # so the price history being appended to is the newest copy.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: npm test

      - name: Check prices and product details
        run: node crawl.js

      - name: Save price history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/menu.json
          if git commit -m "Price check $(date -u +%Y-%m-%dT%H:%MZ)"; then
            git pull --rebase
            git push
          fi

      - name: Build site
        run: node build-static.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site

  # Publishing is its own job (GitHub's recommended layout): by the time it
  # starts, the uploaded site is reliably visible to the deploy step.
  deploy:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
